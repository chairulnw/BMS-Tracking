services:
  db:
    build: ./backend/db
    environment:
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: bms
      POSTGRES_DB: bms_tracking
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms -d bms_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://bms:bms@db/bms_tracking
      AI_SERVICE_URL: http://ai-service:8001
      # thumbnails.py/clips.py default to a path relative to this repo
      # checkout on disk (../ai-service/thumbnails etc) — doesn't exist in a
      # container, since backend and ai-service each only see their own
      # build context. Point them at the same host folders ai-service writes
      # into, mounted below.
      THUMBNAILS_DIR: /shared/thumbnails
      CLIPS_DIR: /shared/output/clips
      CLIPS_WEB_DIR: /shared/output/clips_web
    volumes:
      - ./ai-service/thumbnails:/shared/thumbnails
      - ./ai-service/output:/shared/output
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8002"

  ai-service:
    build: ./ai-service
    env_file: ./ai-service/.env
    environment:
      BACKEND_URL: http://backend:8002
      # Thumbnail/event-snapshot URLs are embedded in API responses and
      # fetched directly by the browser — "backend" (BACKEND_URL's host)
      # only resolves inside the Docker network. This relative path resolves
      # against whatever origin the browser has the frontend open on, and
      # nginx's /api/ location (sistem-kamera-pengawas/nginx.conf) proxies it
      # to backend from there.
      PUBLIC_BACKEND_URL: /api
    volumes:
      - ./ai-service/checkpoints:/app/checkpoints
      - ./ai-service/output:/app/output
      - ./ai-service/thumbnails:/app/thumbnails
    depends_on:
      - backend
    ports:
      - "8001:8001"
    # deploy:                    # <-- TEMPORARY local-only comment-out for
    #   resources:                #     testing on a Mac with no NVIDIA GPU.
    #     reservations:            #     DO NOT commit this — Windows needs it.
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  frontend:
    build: ./sistem-kamera-pengawas
    depends_on:
      - backend
      - ai-service
    ports:
      - "4200:80"

volumes:
  db_data:

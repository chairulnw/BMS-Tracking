server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxied over the Docker network by service name — browser never needs
    # to know backend/ai-service's host-published ports (see environment.prod.ts).
    location /api/ {
        proxy_pass http://backend:8002/;
        proxy_set_header Host $host;
    }

    location /ai/ {
        proxy_pass http://ai-service:8001/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
